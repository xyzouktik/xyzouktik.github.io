<script>
/* Shares the BLACK & WHITE site theme with index.html. */
(function(){
  var D=document.documentElement;
  try{
    var t=localStorage.getItem('site-theme')||localStorage.getItem('cv-theme');
    t = (t==='black'||t==='dark') ? 'black' : (t==='white'||t==='light'||t==='green'||t==='blue') ? 'white' : 'black';
    D.setAttribute('data-theme',t);
    localStorage.setItem('site-theme',t);
  }catch(e){ D.setAttribute('data-theme','black'); }
})();
</script>

  .toolbar{display:flex; justify-content:space-between; align-items:center; gap:1rem; font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:1rem}
  .toolbar a{color:var(--muted); text-decoration:none}
  .toolbar a:hover{color:var(--ink)}
  .tb-right{display:flex; align-items:center; gap:.7rem}
  .menu{position:relative}
  .menu-btn{display:flex; flex-direction:column; justify-content:center; gap:4px; width:2.15rem; height:2.15rem; padding:0 .4rem; background:var(--card); border:1px solid var(--card-border); border-radius:6px; cursor:pointer}

  .menu-btn[aria-expanded="true"] .dash:nth-child(2){opacity:0}

  .theme-picker{display:flex; gap:.4rem; align-items:center}
  .swatch{width:1.15rem; height:1.15rem; padding:0; border:1px solid var(--rule); border-radius:50%; background:transparent; cursor:pointer; display:grid; place-items:center; transition:transform .15s ease, border-color .15s ease}

  .swatch[data-theme-choice="white"] > span{background:#ffffff; box-shadow:inset 0 0 0 1px #b9b9b9}
  .swatch[data-theme-choice="black"] > span{background:#111111}

  .swatch[aria-checked="true"]{border-color:var(--ink)}
  header.page{margin:.6rem 0 1.6rem; text-align:center}

  .rail-track{display:flex; justify-content:flex-start; gap:.9rem; overflow-x:auto; scroll-snap-type:x mandatory; scroll-behavior:smooth; padding:.3rem .2rem .9rem; -webkit-overflow-scrolling:touch}

  .rail-btn.prev{left:-.7rem} .rail-btn.next{right:-.7rem}

  .sec-note{margin:.2rem 0 0; max-width:44rem; font-size:1.05rem; color:var(--ink)}
  .tile{margin:0; border:1px solid var(--card-border); border-radius:10px; overflow:hidden; background:#0d0d0d; cursor:zoom-in; position:relative}

  .tile figcaption{font-family:var(--mono); font-size:.62rem; color:var(--muted); padding:.45rem .6rem; background:var(--card); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tile:hover img,.tile:hover video{filter:brightness(1.08)}
  .card{display:flex; flex-direction:column; text-align:left; padding:0; border:1px solid var(--card-border); border-radius:10px; overflow:hidden; background:var(--card); color:var(--ink); font:inherit; cursor:pointer; transition:transform .22s ease, border-color .22s ease}
  .card:hover{transform:translateY(-3px); border-color:var(--ink)}
  .card-media{position:relative; aspect-ratio:4/3; background:#0d0d0d; overflow:hidden}
  .card-media img,.card-media video{width:100%; height:100%; object-fit:contain; display:block}
  .card-body{padding:.85rem .95rem 1rem}
  .card h3{margin:0 0 .3rem; font-size:1.06rem; font-weight:600; line-height:1.25}
  .card .tags{font-family:var(--mono); font-size:.6rem; color:var(--muted); margin:0}
  .story{position:fixed; inset:0; z-index:50; background:var(--paper); overflow-y:auto; overscroll-behavior:contain; opacity:0; visibility:hidden; transition:opacity .3s ease, visibility .3s ease}
  .story.open{opacity:1; visibility:visible}
  .story-inner{max-width:52rem; margin:0 auto; padding:1.5rem 1.4rem 4rem}
  .story-bar{position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.7rem 0; background:var(--paper); border-bottom:1px solid var(--rule); margin-bottom:1.1rem}
  .close{font-family:var(--mono); font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; background:none; border:1px solid var(--card-border); color:var(--muted); border-radius:6px; padding:.4rem .7rem}
  .close:hover{color:var(--ink); border-color:var(--ink)}
  .story h1{margin:.1rem 0 .3rem; font-size:1.8rem}
  .story .kicker{font-family:var(--mono); font-size:.64rem; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); margin:0}
  .story .body{font-size:1.02rem; margin:.6rem 0 1rem; color:var(--ink)}
  .timeline{display:flex; flex-wrap:wrap; gap:.4rem; margin:.2rem 0 1rem}
  .step{font-family:var(--mono); font-size:.62rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); border:1px solid var(--card-border); border-radius:999px; padding:.24rem .58rem}
  .shots{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.7rem; margin:.4rem 0 1rem}
  .ext-link{display:inline-block; font-family:var(--mono); font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--paper); background:var(--ink); border:1px solid var(--ink); border-radius:6px; padding:.5rem .8rem; margin:.3rem 0 0; text-decoration:none}

  .lightbox.open{opacity:1; visibility:visible}
  .lb-stage img,.lb-stage video{max-width:94vw; max-height:82vh; display:block; margin:0 auto}
  .lb-cap{font-family:var(--mono); font-size:.68rem; color:#cfcfcf; text-align:center; margin:.6rem 0 0}
  .lb-btn{position:absolute; font-family:var(--mono); color:#fff; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.25); border-radius:8px; width:2.4rem; height:2.4rem; cursor:pointer; display:grid; place-items:center}
  .lb-btn:hover{background:rgba(255,255,255,.18)}
  .lb-close{top:1rem; right:1rem}
  .lb-prev{left:1rem; top:50%; transform:translateY(-50%)}
  .lb-next{right:1rem; top:50%; transform:translateY(-50%)}
  footer{font-family:var(--mono); font-size:.72rem; color:var(--muted); text-align:center; margin-top:2rem; padding-top:.9rem; border-top:1px solid var(--rule)}

    html{-webkit-text-size-adjust:100%}
    .sheet{padding:1.1rem 1.1rem 2.4rem}
    header.page{margin:.4rem 0 1.2rem}
    header.page h1{font-size:2rem}
    header.page p.sub{font-size:.97rem}
    .rail-track{gap:.7rem}
    .rail-track > *{width:82vw}
    .story-inner{padding:1.1rem 1.1rem 3rem}
    .shots{grid-template-columns:1fr}
    .lb-btn{width:2.7rem; height:2.7rem}
    .lb-prev{left:.5rem} .lb-next{right:.5rem}
    .swatch{width:1.55rem; height:1.55rem}
    .swatch > span{width:.85rem; height:.85rem}
    .menu-btn{width:2.5rem; height:2.5rem}
    .menu-panel{position:fixed; left:.6rem; right:.6rem; top:3.6rem; min-width:0; max-height:70vh; overflow:auto}
  }  @media (prefers-reduced-motion: reduce){ #bgvid{display:none} .card,.story,.lightbox{transition:none} .card:hover{transform:none} }
  @media print{ #bgvid,#bgveil,.toolbar,.story,.lightbox{display:none} }
</style>

  function el(t, c) { var n = document.createElement(t); if (c) n.className = c; return n; }
  function srcOf(it) { return it.src || it.img; }

  function mediaNode(it) {
    if (it.type === 'video') { var v = el('video'); v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'metadata'; v.src = srcOf(it); return v; }
    var im = el('img'); im.src = srcOf(it); im.alt = capOf(it); im.loading = 'lazy'; return im;
  }

  var story = document.getElementById('story'), lightbox = document.getElementById('lightbox');
  var lbList = [], lbIndex = 0, lastFocus = null;

  function openLightbox(list, i) {
    lbList = list || []; lbIndex = Math.max(0, i || 0); renderLb();
    lightbox.classList.add('open'); lightbox.setAttribute('aria-hidden', 'false'); document.body.classList.add('no-scroll');
    document.getElementById('lb-close').focus();
  }
  function closeLightbox() { lightbox.classList.remove('open'); lightbox.setAttribute('aria-hidden', 'true'); document.body.classList.remove('no-scroll'); }
  function renderLb() {
    if (!lbList.length) { closeLightbox(); return; }
    lbIndex = Math.max(0, Math.min(lbList.length - 1, lbIndex));
    var it = lbList[lbIndex], stage = document.getElementById('lb-stage'); stage.innerHTML = '';
    if (it.type === 'video') { var v = el('video'); v.src = it.src; v.controls = true; v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true; stage.appendChild(v); var p = v.play(); if (p && p.catch) p.catch(function(){}); }
    else { var im = el('img'); im.src = it.src; im.alt = it.caption || ''; stage.appendChild(im); }
    document.getElementById('lb-cap').textContent = (it.caption || '') + '  (' + (lbIndex + 1) + ' / ' + lbList.length + ')';
  }
  function stepLb(d) { if (!lbList.length) return; lbIndex = (lbIndex + d + lbList.length) % lbList.length; renderLb(); }

  function openStory(b) {
    lastFocus = document.activeElement;
    document.getElementById('story-kicker').textContent = b.kicker;
    document.getElementById('story-title').textContent = b.title;
    document.getElementById('story-meta').textContent = 'Built / Experimented by Youktik Sajjan';

    var cov = document.getElementById('story-cover'); cov.innerHTML = '';
    var ci = el('img'); ci.src = b.cover.src; ci.alt = b.cover.caption || b.title; ci.style.cssText = 'width:100%;max-height:60vh;object-fit:contain;background:#0d0d0d;border:1px solid var(--card-border);border-radius:10px;display:block;margin:.2rem 0 1rem'; cov.appendChild(ci);

    var shots = document.getElementById('story-shots'); shots.innerHTML = '';
    b.media.forEach(function (m, i) {
      var fig = el('figure', 'tile');
      fig.appendChild(mediaNode(m));
      var c = el('figcaption'); c.textContent = m.caption || ''; fig.appendChild(c);
      fig.tabIndex = 0; fig.setAttribute('role', 'button');
      fig.addEventListener('click', function () { openLightbox(b.media, i); });
      fig.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(b.media, i); } });
      shots.appendChild(fig);
    });
    document.getElementById('story-tags').textContent = b.tags;
    story.classList.add('open'); story.setAttribute('aria-hidden', 'false'); document.body.classList.add('no-scroll'); story.scrollTop = 0;
    document.getElementById('story-close').focus();
  }
  function closeStory() { story.classList.remove('open'); story.setAttribute('aria-hidden', 'true'); document.body.classList.remove('no-scroll'); if (lastFocus && lastFocus.focus) lastFocus.focus(); }

  function makeCard(b) {
    var card = el('article', 'card'); card.tabIndex = 0; card.setAttribute('role', 'button'); card.setAttribute('aria-label', 'Read the story: ' + b.title);
    var m = el('div', 'card-media'); var im = el('img'); im.src = b.cover.src; im.alt = b.cover.caption || b.title; im.loading = 'lazy'; m.appendChild(im); card.appendChild(m);
    var body = el('div', 'card-body'); var h = el('h3'); h.textContent = b.title; body.appendChild(h);
    var tg = el('p', 'tags'); tg.textContent = b.tags; body.appendChild(tg); card.appendChild(body);
    card.addEventListener('click', function () { openStory(b); });
    card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openStory(b); } });

  var host = document.getElementById('sections');

  DATA.forEach(function (sec) {

          var list = nodes.map(function (n) { var f = n.parentNode, cc = f ? f.querySelector('figcaption') : null; return { type: n.tagName === 'VIDEO' ? 'video' : 'image', src: n.getAttribute('src'), caption: cc ? cc.textContent : '' }; });
          openLightbox(list, nodes.indexOf(media));

        fig.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fig.click(); } });
        track.appendChild(fig);
      });
    }
    rail.appendChild(track); s.appendChild(rail); host.appendChild(s);
  });

  /* rails: arrows + centre when the items fit */
  Array.prototype.forEach.call(document.querySelectorAll('[data-rail]'), function (track) {
    var rail = track.parentNode;
    var prev = el('button'), next = el('button');
    prev.type = 'button'; prev.className = 'rail-btn prev'; prev.setAttribute('aria-label', 'Scroll left'); prev.textContent = '‹';
    next.type = 'button'; next.className = 'rail-btn next'; next.setAttribute('aria-label', 'Scroll right'); next.textContent = '›';
    rail.appendChild(prev); rail.appendChild(next);
    function measure() {
      var few = track.scrollWidth <= track.clientWidth + 4;
      track.classList.toggle('few', few);
      prev.style.display = next.style.display = few ? 'none' : '';
    }
    function step() { return Math.max(240, Math.round(track.clientWidth * 0.8)); }
    prev.addEventListener('click', function () { track.scrollBy({ left: -step(), behavior: 'smooth' }); });
    next.addEventListener('click', function () { track.scrollBy({ left: step(), behavior: 'smooth' }); });
    function upd() { var max = track.scrollWidth - track.clientWidth - 2; prev.disabled = track.scrollLeft <= 2; next.disabled = track.scrollLeft >= max; }
    track.addEventListener('scroll', upd, { passive: true });
    window.addEventListener('resize', function () { measure(); upd(); });
    measure(); upd();
    /* play videos muted on hover */
    Array.prototype.forEach.call(track.querySelectorAll('video'), function (v) {
      v.addEventListener('mouseenter', function () { var p = v.play(); if (p && p.catch) p.catch(function(){}); });
      v.addEventListener('mouseleave', function () { v.pause(); });
    });
  });

  document.getElementById('story-close').addEventListener('click', closeStory);
  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-prev').addEventListener('click', function () { stepLb(-1); });
  document.getElementById('lb-next').addEventListener('click', function () { stepLb(1); });
  lightbox.addEventListener('click', function (e) { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (lightbox.classList.contains('open')) closeLightbox(); else if (story.classList.contains('open')) closeStory(); }
    if (lightbox.classList.contains('open')) { if (e.key === 'ArrowLeft') stepLb(-1); if (e.key === 'ArrowRight') stepLb(1); }
  });
  document.getElementById('year').textContent = new Date().getFullYear();
})();

<script>
(function(){
  var root = document.documentElement, meta = document.getElementById('theme-color');
  var DMETA = { black:'#0a0a0a', white:'#ffffff' };
  var sw = [].slice.call(document.querySelectorAll('.swatch'));
  function current(){ return root.getAttribute('data-theme') || 'black'; }
  function paint(){ var t = current(); if (meta) meta.setAttribute('content', DMETA[t] || DMETA.black); sw.forEach(function(b){ var on = b.getAttribute('data-theme-choice') === t; b.setAttribute('aria-checked', on ? 'true' : 'false'); b.setAttribute('tabindex', on ? '0' : '-1'); }); }
  function set(t){ if (t !== 'black' && t !== 'white') t = 'black'; root.setAttribute('data-theme', t); try { localStorage.setItem('site-theme', t); } catch(e){} paint(); }
  sw.forEach(function(b, idx){
    b.addEventListener('click', function(){ set(b.getAttribute('data-theme-choice')); b.focus(); });
    b.addEventListener('keydown', function(e){ var n = -1;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') n = (idx + 1) % sw.length;
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') n = (idx - 1 + sw.length) % sw.length;
      else if (e.key === ' ' || e.key === 'Enter') { set(sw[idx].getAttribute('data-theme-choice')); e.preventDefault(); return; }
      if (n >= 0) { e.preventDefault(); sw[n].focus(); set(sw[n].getAttribute('data-theme-choice')); }
    });
  });
  var btn = document.getElementById('menu-btn'), panel = document.getElementById('menu-panel');
  function closeMenu(){ panel.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
  btn.addEventListener('click', function(e){ e.stopPropagation(); var open = panel.hidden; panel.hidden = !open; btn.setAttribute('aria-expanded', open ? 'true' : 'false'); });
  panel.addEventListener('click', function(e){ if (e.target.closest && e.target.closest('a')) closeMenu(); });
  document.addEventListener('click', function(e){ if (!panel.hidden && !(e.target.closest && e.target.closest('.menu'))) closeMenu(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeMenu(); });
  window.addEventListener('storage', function(e){ if (e.key === 'site-theme' && e.newValue) { root.setAttribute('data-theme', e.newValue); paint(); } });
  paint();
})();
</script>
<script>
/* Cursor-reactive dot grid over the wallpaper. */
(function () {
  var c = document.getElementById('grid');
  if (!c) return;
  var g = c.getContext('2d');
  var W = 0, H = 0, dpr = 1, mx = -9999, my = -9999, raf = 0;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function ink() { var v = getComputedStyle(document.documentElement).getPropertyValue('--ink'); return (v && v.trim()) || '#ffffff'; }
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    c.style.width = W + 'px'; c.style.height = H + 'px';
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    paint();
  }
  var STEP = 34, R = 150;
  function paint() {
    g.clearRect(0, 0, W, H);
    var col = ink(), half = STEP / 2;
    for (var gx = half; gx < W; gx += STEP) {
      for (var gy = half; gy < H; gy += STEP) {
        var dx = gx - mx, dy = gy - my, d = Math.sqrt(dx * dx + dy * dy);
        var t = d < R ? (1 - d / R) : 0;
        g.globalAlpha = 0.10 + t * 0.6;
        g.fillStyle = col;
        g.beginPath(); g.arc(gx, gy, 1 + t * t * 3.4, 0, 6.2832); g.fill();
      }
    }
    g.globalAlpha = 1;
  }
  function loop() { paint(); raf = window.requestAnimationFrame(loop); }
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('pointermove', function (e) { mx = e.clientX; my = e.clientY; }, { passive: true });
  window.addEventListener('pointerout', function () { mx = -9999; my = -9999; });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (raf) { window.cancelAnimationFrame(raf); raf = 0; } }
    else if (!reduced && !raf) { raf = window.requestAnimationFrame(loop); }
  });
  resize();
  if (!reduced) raf = window.requestAnimationFrame(loop);
})();
</script>
<script>
/* Loading screen: hold until the wallpaper can play, then hand over. */
(function () {
  var intro = document.getElementById('intro');
  if (!intro) return;
  var line = intro.querySelector('.intro-line');
  var t0 = Date.now(), done = false, reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function handover() {
    if (done) return; done = true;
    var minWait = Math.max(0, 4000 - (Date.now() - t0));
    setTimeout(function () {
      line.textContent = 'embrace your stargazer';
      setTimeout(function () {
        intro.classList.add('hide');
        setTimeout(function () { if (intro.parentNode) intro.parentNode.removeChild(intro); }, 650);
      }, reduced ? 100 : 750);
    }, minWait);
  }
  var v = document.getElementById('bgvid');
  if (v) {
    if (v.readyState >= 3) handover();
    else { v.addEventListener('canplay', handover, { once: true }); v.addEventListener('loadeddata', handover, { once: true }); }
  }
  window.addEventListener('load', function () { setTimeout(handover, 350); });
  setTimeout(handover, 4400);
})();
</script>
